buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1' // works with Qt 6.8+ // Java 17
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.application'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}

android {
   /*******************************************************
    * The following variables:
    * - androidBuildToolsVersion
    * - androidCompileSdkVersion
    * - androidNdkVersion
    * - qtMinSdkVersion
    * - qtTargetSdkVersion
    * - qtAndroidDir - holds the path to qt android files needed to build any Qt app
    *
    * are written into gradle.properties by androiddeployqt,
    * from the QT_ANDROID_* target properties set in CMakeLists.txt.
    *******************************************************/

    namespace = androidPackageName
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion
    ndkVersion androidNdkVersion

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    // Do not compress Qt binary resources file
    androidResources {
        noCompress += 'rcc'
    }

    defaultConfig {
        resConfig "en"
        minSdk qtMinSdkVersion.toInteger()
        targetSdk qtTargetSdkVersion.toInteger()
        ndk.abiFilters = qtTargetAbiList.split(",")

        namespace "io.emeric.mobileuidemo"

        packaging {
            jniLibs {
                useLegacyPackaging true // keep this for Qt 6.8 support
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.incremental = true
    options.compilerArgs += ['-Xlint:all']
}
